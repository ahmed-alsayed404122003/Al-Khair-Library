VW.ana=()=>{const d=anData();return `<h2>تحليل المنتجات <button onclick="exOpen('ana')" style="font-size:.8rem">📄 تصدير PDF</button></h2><div class=bar><label>من <input type=date value="${A.a}" onchange="A.a=this.value;R()"></label><label>إلى <input type=date value="${A.b}" onchange="A.b=this.value;R()"></label><select onchange="A.c=this.value;R()"><option value="">كل التصنيفات</option>${S.c.map(c=>`<option ${c==A.c?'selected':''}>${esc(c)}</option>`).join('')}</select><input placeholder="منتج" value="${esc(A.q)}" onchange="A.q=this.value;R()" style="max-width:160px"><label>راكد بعد <input type=number min=1 value="${A.d}" onchange="A.d=Math.max(1,+this.value||30);R()" style="width:70px"> يوم</label></div><div class=grid>${card('إيرادات الفترة',f(sum(d.rows,m=>m.r)))}${card('أرباح الفترة',f(sum(d.rows,m=>m.p)),'g')}${card('منتجات راكدة',f(d.st.length),'w')}${card('نواقص',f(d.lw.length),d.lw.length?'r':'')}</div>`+anBody(d)};
function exOpen(t){if(t!='debts'&&!ad())return;ask('تصدير تقرير PDF',[{k:'t',l:'نوع التقرير',t:'sel',v:t,o:[['sales','المبيعات والأرباح'],['stock','المخزون'],['debts','المديونيات'],['ana','تحليل المنتجات']].filter(x=>isA()||x[0]=='debts')},{k:'a',l:'من تاريخ (اتركه فارغًا للبداية)',t:'date',v:t=='ana'?A.a:R0.a},{k:'b',l:'إلى تاريخ',t:'date',v:t=='ana'?A.b:R0.b}],o=>{exRun(o.t,o.a,o.b)},'اختر النوع والفترة (تُستخدم في المبيعات وتحليل المنتجات)، ثم اختر «حفظ كـ PDF» من نافذة الطباعة.','تصدير')}
function exRun(t,a,b){const sub=a||b?`الفترة: ${a||'البداية'} إلى ${b||'اليوم'}`:'كل الفترات';
 if(t=='sales'){const r=invs(a||'0000',b||'9999');prn('تقرير المبيعات والأرباح',sub,`<p>المبيعات: <b>${f(sum(r,nt))}</b> — صافي الأرباح: <b>${f(sum(r,prof))}</b> — عدد الفواتير: ${f(r.length)}</p>${tb(['الرقم','التاريخ','الإجمالي بعد المرتجع','الربح'],r.map(x=>[fid(x.id),dt(x.t),f(nt(x)),f(prof(x))]))}`)}
 else if(t=='stock')prn('تقرير المخزون','',`<p>الوحدات: <b>${f(sum(S.p,p=>p.q))}</b> — القيمة بسعر الشراء: <b>${f(sv('b'))}</b> — بسعر البيع: <b>${f(sv('s'))}</b></p>${tb(['المنتج','التصنيف','الكمية','شراء','بيع','قيمة الشراء'],S.p.map(p=>[esc(p.n),esc(p.c),f(p.q),f(p.b),f(p.s),f(p.q*p.b)]))}`)
 else if(t=='debts')prn('تقرير المديونيات','',`<p>إجمالي الديون: <b>${f(debtTot())}</b></p>${tb(['الاسم','الهاتف','المتبقي'],S.d.map(d=>[esc(d.n),esc(d.ph||''),f(d.bal)]))}`)
 else{const s0=A.a,s1=A.b;A.a=a;A.b=b;const d=anData();A.a=s0;A.b=s1;prn('تقرير تحليل المنتجات',sub,anBody(d))}}
let busy=0;
async function chk(d){if(!d||d.by===DEV||d.u<=(S.u||0)||busy)return;busy=1;try{await pull(d);clearTimeout(pt);cart=cart.filter(c=>{const p=S.p.find(p=>p.id==c.id);if(p&&c.q>p.q)c.q=p.q;return p&&c.q>0});SY='☁️ متزامن بين الأجهزة';if($('#lock').style.display=='none'){R();toast('🔄 تم تحديث البيانات من جهاز آخر')}ssy()}catch(e){}busy=0}
